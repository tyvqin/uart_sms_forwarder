database:
  enabled: true
  type: sqlite
  sqlite:
    path: "./data/app.db"
  show_sql: false

log:
  level: debug
  filename: ./logs/sms.log

server:
  addr: "0.0.0.0:8080"
  ip_extractor: "X-Real-IP"

App:
  JWT:
    Secret: ""
    ExpiresHours: 168
  Users:
    admin: "CHANGE_ME_BCRYPT_HASH"
  OIDC:
    Enabled: false
    Issuer: ""
    ClientID: ""
    ClientSecret: ""
    RedirectURL: "http://localhost:8080/oidc/callback"

  Serial:
    # Backward-compatible single-device mode. Empty means auto-detect.
    Port: ""

    # Auto-discover mode scans /dev/serial/by-path and ttyACM/ttyUSB ports,
    # probes the uart_sms_forwarder protocol, and binds modules by SIM identifier.
    AutoDiscover: false

    # Multi-device mode. With AutoDiscover enabled, Port can be omitted and the
    # Devices:
    #   - ID: sim1
    #     Name: "SIM 1"
    #   - ID: sim2
    #     Name: "SIM 2"
