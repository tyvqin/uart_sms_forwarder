database:
  enabled: true
  type: sqlite
  sqlite:
    path: "./data/app.db"
  show_sql: false

log:
  level: debug
  filename: ./logs/sms.log

server:
  addr: "0.0.0.0:8080"
  ip_extractor: "X-Real-IP"

App:
  JWT:
    Secret: ""
    ExpiresHours: 168
  Users:
    admin: "$2y$12$7DXcOiX1D59xNTIn5riUKusAPLP88LxxoczWmUT83MBj5EFznbp8a"
  OIDC:
    Enabled: false
    Issuer: ""
    ClientID: ""
    ClientSecret: ""
    RedirectURL: "http://localhost:8080/oidc/callback"

  Serial:
    # Backward-compatible single-device mode. Empty means auto-detect.
    Port: ""

    # Multi-device mode. When Devices is configured, every device must use a fixed Port.
    # Prefer /dev/serial/by-path/... or your own udev alias such as /dev/air780/sim1.
    # Devices:
    #   - ID: sim1
    #     Name: "SIM 1"
    #     Port: "/dev/air780/sim1"
    #     ExpectedICCID: ""
    #   - ID: sim2
    #     Name: "SIM 2"
    #     Port: "/dev/air780/sim2"
    #     ExpectedICCID: ""
